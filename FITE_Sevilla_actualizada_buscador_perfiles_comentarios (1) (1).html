<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITE - Fuentes de Información Transparentes y Entendibles</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        albero: '#E5A93B',
                        alberoDark: '#C98D25',
                        maestranza: '#8B2323',
                        maestranzaHover: '#6D1919',
                        azahar: '#FDFBF7',
                        suave: '#2C2A29'
                    },
                    fontFamily: {
                        seville: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FDFBF7; color: #2C2A29; }
        .font-seville { font-family: 'Playfair Display', serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #FDFBF7; }
        ::-webkit-scrollbar-thumb { background: #E5A93B; border-radius: 4px; }
        .district-path {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .district-path:hover {
            opacity: 0.92 !important;
            filter: drop-shadow(0px 4px 12px rgba(139,35,35,0.6));
            transform: scale(1.01);
            transform-origin: center;
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between selection:bg-albero selection:text-maestranza">
    <!-- ACCESO OBLIGATORIO FITE -->
    <section id="authGate" class="fixed inset-0 z-[100] bg-[#FDFBF7] flex items-center justify-center p-4 overflow-y-auto">
        <div class="w-full max-w-md bg-white rounded-3xl border-4 border-[#E5A93B] shadow-2xl p-7 sm:p-9">
            <div class="flex items-center justify-center gap-3 mb-5">
                <div class="text-center">
                    <div class="font-seville text-4xl font-black text-[#8B2323]">FITE</div>
                    <p class="text-xs font-bold text-[#2C2A29]">Fuente de Información Transparente y Entendible</p>
                </div>
            </div>
            <h1 id="authHeading" class="font-seville text-2xl font-black text-[#2C2A29] text-center mb-2">Inicia sesión</h1>
            <p class="text-sm text-gray-600 text-center mb-6">Accede a FITE Sevilla para informarte y participar en la comunidad.</p>
            <form id="authForm" onsubmit="submitFiteAuth(event)" class="space-y-4">
                <div id="authNameWrap" class="hidden">
                    <label class="block text-xs font-bold text-[#2C2A29] mb-1">Nombre de usuario</label>
                    <input id="authName" type="text" autocomplete="name" class="w-full px-3 py-3 border border-[#E5A93B] rounded-xl text-sm" placeholder="Tu nombre">
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#2C2A29] mb-1">Correo electrónico</label>
                    <input id="authEmail" type="email" required autocomplete="email" class="w-full px-3 py-3 border border-[#E5A93B] rounded-xl text-sm" placeholder="nombre@correo.com">
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#2C2A29] mb-1">Contraseña</label>
                    <input id="authPassword" type="password" required minlength="6" autocomplete="current-password" class="w-full px-3 py-3 border border-[#E5A93B] rounded-xl text-sm" placeholder="Mínimo 6 caracteres">
                </div>
                <p id="authError" class="hidden text-sm text-red-700 bg-red-50 rounded-xl p-3" role="alert"></p>
                <button id="authSubmit" type="submit" class="w-full py-3 bg-[#8B2323] text-white rounded-xl font-bold shadow hover:bg-[#6D1919] transition">Entrar en FITE</button>
            </form>
            <p class="text-sm text-center text-gray-600 mt-5">
                <span id="authSwitchText">¿Aún no tienes cuenta?</span>
                <button type="button" id="authSwitch" onclick="toggleFiteAuthMode()" class="font-bold text-[#8B2323] underline ml-1">Crear cuenta</button>
            </p>
            <p id="firebaseSetupNotice" class="text-[11px] leading-relaxed text-gray-500 text-center mt-6 border-t pt-4">
                Para activar el acceso real, la persona administradora debe conectar este sitio con un proyecto de Firebase Authentication.
            </p>
        </div>
    </section>

    <!-- HEADER / NAVIGATION BAR -->
    <header class="bg-albero shadow-md sticky top-0 z-50 border-b-4 border-maestranza">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
